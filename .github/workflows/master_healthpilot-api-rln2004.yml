# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Python app to Azure Web App - healthpilot-api-rln2004

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: healthpilot-api-rln2004
  AZURE_RESOURCE_GROUP: healthpilot-rg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B5BB9A5418BA4DDCB3A27E86422E6D60 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_09CC985ED77C4784A949168107A53072 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F7EB852A58F14AD89E60845CC8331CF1 }}

      - name: Configure App Service startup
        run: |
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --startup-file "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
